[project]
name = "ntu-dual-guide"
version = "0.1.0"
description = "LLMOps and RAG tooling for NTU dual-major guidance."
requires-python = ">=3.8"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn>=0.30,<1.0",
]

[tool.setuptools]

[tool.setuptools.package-dir]
ntu_dual_guide_ingestion = "packages/ingestion/src/ntu_dual_guide_ingestion"
ntu_dual_guide_rag = "packages/rag/src/ntu_dual_guide_rag"

[tool.setuptools.packages.find]
where = ["packages/ingestion/src", "packages/rag/src", "packages/evals/src"]
